name: Publish Docker Image

# Manual-only publish step. Takes an image previously produced by
# "Build Docker Image" - by default the newest successful build - and:
#
#   1. copies `ghcr.io/<owner>/affine:<tag>` to `docker.io/<DOCKER_USER>/affine`
#   2. moves `latest`, `<channel>` and `<version>` on both registries
#
# Nothing is rebuilt: the copy happens registry-to-registry, so this finishes in
# seconds even though the image is multi-gigabyte and multi-platform.
#
# Required repository secrets:
#   DOCKER_USER      - Docker Hub account name (also the Docker Hub namespace)
#   DOCKER_PASSWORD  - Docker Hub access token
#   GH_TOKEN         - optional PAT used for GHCR; falls back to GITHUB_TOKEN

on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: 'Image tag to publish (optional, defaults to the newest successful build)'
        type: string
        required: false
      dockerhub:
        description: 'Also publish to Docker Hub'
        type: boolean
        default: true
      moving-tags:
        description: 'Move `latest` and `<channel>` tags to this image'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  prepare:
    name: Resolve image to publish
    runs-on: ubuntu-latest
    outputs:
      source-tag: ${{ steps.prepare.outputs.source-tag }}
      channel: ${{ steps.prepare.outputs.channel }}
      version: ${{ steps.prepare.outputs.version }}
      image-namespace: ${{ steps.prepare.outputs.image-namespace }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve source tag
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.source-tag }}
          DOCKERHUB_ENABLED: ${{ inputs.dockerhub }}
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKER_USER }}
          DOCKERHUB_HAS_PASSWORD: ${{ secrets.DOCKER_PASSWORD != '' }}
          IMAGE_NAMESPACE: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "${DOCKERHUB_ENABLED}" = "true" ] && { [ -z "${DOCKERHUB_NAMESPACE}" ] || [ "${DOCKERHUB_HAS_PASSWORD}" != "true" ]; }; then
            echo "::error::Docker Hub publishing is enabled but the 'DOCKER_USER' and/or 'DOCKER_PASSWORD' repository secrets are empty. Add them under Settings → Secrets and variables → Actions, or untick the 'dockerhub' input."
            exit 1
          fi

          version=""
          if [ -n "${INPUT_TAG}" ]; then
            source_tag="${INPUT_TAG}"
          else
            run_id=$(gh run list --workflow=docker-build.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
            if [ -z "${run_id}" ] || [ "${run_id}" = "null" ]; then
              echo "::error::No successful 'Build Docker Image' run found. Run that workflow first, or pass a 'source-tag' explicitly."
              exit 1
            fi
            meta_dir=$(mktemp -d)
            gh run download "${run_id}" --name image-meta --dir "${meta_dir}"
            meta_file=$(find "${meta_dir}" -name 'image-meta.json' | head -n 1)
            if [ -z "${meta_file}" ]; then
              echo "::error::The newest build run (${run_id}) has no image metadata artifact."
              exit 1
            fi
            source_tag=$(node -p "JSON.parse(require('node:fs').readFileSync('${meta_file}', 'utf8')).tag")
            version=$(node -p "JSON.parse(require('node:fs').readFileSync('${meta_file}', 'utf8')).version ?? ''")
            echo "Using the image from build run ${run_id}."
          fi

          # `<channel>-<short-hash>` is what the build workflow pushes; anything
          # else (a version tag, a hand-made tag) has no channel of its own.
          candidate="${source_tag%-*}"
          case "${candidate}" in
            canary | beta | stable | internal) channel="${candidate}" ;;
            *) channel="" ;;
          esac

          echo "source-tag=${source_tag}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image-namespace=${IMAGE_NAMESPACE}" >> "$GITHUB_OUTPUT"
          {
            echo "Publishing \`ghcr.io/${IMAGE_NAMESPACE}/affine:${source_tag}\`"
            echo ""
            echo "- channel tag: \`${channel:-none}\`"
            echo "- version tag: \`${version:-none}\`"
            echo "- docker hub: ${{ inputs.dockerhub }}"
            echo "- moving tags: ${{ inputs.moving-tags }}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Copy and tag
    needs:
      - prepare
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        # The namespace is read straight from the secret here: a job output that
        # contains a secret arrives empty, which used to skip this step silently.
        if: ${{ inputs.dockerhub }}
        shell: bash
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKER_USER }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USER}" ] || [ -z "${DOCKERHUB_PASSWORD}" ]; then
            echo "::error::Docker Hub publishing is enabled but the 'DOCKER_USER' and/or 'DOCKER_PASSWORD' repository secrets are empty. Add them under Settings → Secrets and variables → Actions, or untick the 'dockerhub' input."
            exit 1
          fi
          echo "${DOCKERHUB_PASSWORD}" | docker login docker.io --username "${DOCKERHUB_USER}" --password-stdin
          echo "DOCKERHUB_NAMESPACE=${DOCKERHUB_USER}" >> "$GITHUB_ENV"
      - name: Publish
        shell: bash
        env:
          SOURCE_TAG: ${{ needs.prepare.outputs.source-tag }}
          IMAGE_NAMESPACE: ${{ needs.prepare.outputs.image-namespace }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MOVING_TAGS: ${{ inputs.moving-tags }}
        run: |
          set -euo pipefail
          source="ghcr.io/${IMAGE_NAMESPACE}/affine:${SOURCE_TAG}"
          ghcr_image="ghcr.io/${IMAGE_NAMESPACE}/affine"
          images=("${ghcr_image}")
          if [ -n "${DOCKERHUB_NAMESPACE:-}" ]; then
            images+=("docker.io/${DOCKERHUB_NAMESPACE}/affine")
          fi

          published=()
          for image in "${images[@]}"; do
            tag_args=()
            # The GHCR copy already carries the immutable tag; Docker Hub needs it.
            if [ "${image}" != "${ghcr_image}" ]; then
              tag_args+=(--tag "${image}:${SOURCE_TAG}")
            fi
            if [ "${MOVING_TAGS}" = "true" ]; then
              tag_args+=(--tag "${image}:latest")
              if [ -n "${CHANNEL}" ]; then
                tag_args+=(--tag "${image}:${CHANNEL}")
              fi
              if [ -n "${VERSION}" ]; then
                tag_args+=(--tag "${image}:${VERSION}")
              fi
            fi
            if [ "${#tag_args[@]}" -eq 0 ]; then
              continue
            fi
            docker buildx imagetools create "${tag_args[@]}" "${source}"
            for ((index = 0; index < ${#tag_args[@]}; index += 2)); do
              published+=("${tag_args[index + 1]}")
            done
          done

          {
            echo ""
            echo "### Published"
            echo ""
            echo '```'
            printf '%s\n' "${published[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
