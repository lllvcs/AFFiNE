name: Copilot Test Automatically

# Manual-only: the daily/tag dispatch is upstream automation this fork does not need.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch-test:
    runs-on: ubuntu-latest
    name: Setup Test
    steps:
      - name: dispatch test by tag
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: copilot-test.yml
