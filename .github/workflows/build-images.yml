name: Build Images

on:
  workflow_call:
    inputs:
      build-type:
        type: string
        required: true
      app-version:
        type: string
        required: true
      git-short-hash:
        type: string
        required: true
      # The built image is pushed to GHCR only: it is the hand-off artifact the
      # publish workflow copies to the final registries and tags. Pushing here
      # keeps the transfer registry-to-registry instead of shipping a
      # multi-gigabyte image archive through the workflow artifacts.
      image-namespace:
        description: 'GHCR namespace. Defaults to the repository owner.'
        type: string
        required: false
        default: ''
      platforms:
        description: 'Platforms passed to buildx.'
        type: string
        required: false
        default: 'linux/amd64,linux/arm64,linux/arm/v7'
      build-admin:
        description: 'Build the admin panel bundle.'
        type: boolean
        required: false
        default: true
      build-mobile:
        description: 'Build the mobile web bundle.'
        type: boolean
        required: false
        default: true
    secrets:
      GH_TOKEN:
        required: false
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_DSN:
        required: false
      PERFSEE_TOKEN:
        required: false
      AFFINE_PRO_PUBLIC_KEY:
        required: false
      AFFINE_PRO_LICENSE_AES_KEY:
        required: false

permissions:
  contents: 'write'
  id-token: 'write'
  packages: 'write'

jobs:
  build-web:
    name: Build @affine/web
    runs-on: ubuntu-latest
    environment: ${{ inputs.build-type }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build Core
        run: yarn affine @affine/web build
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD_TYPE: ${{ inputs.build-type }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: 'affine-web'
          SENTRY_RELEASE: ${{ inputs.app-version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PERFSEE_TOKEN: ${{ secrets.PERFSEE_TOKEN }}
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist
          if-no-files-found: error

  build-admin:
    name: Build @affine/admin
    if: ${{ inputs.build-admin }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.build-type }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build Admin
        run: yarn affine @affine/admin build
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD_TYPE: ${{ inputs.build-type }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: 'affine-admin'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PERFSEE_TOKEN: ${{ secrets.PERFSEE_TOKEN }}
      - name: Upload admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist
          if-no-files-found: error

  build-mobile:
    name: Build @affine/mobile
    if: ${{ inputs.build-mobile }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.build-type }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
      - name: Build Mobile
        run: yarn affine @affine/mobile build
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD_TYPE: ${{ inputs.build-type }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: 'affine-mobile'
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PERFSEE_TOKEN: ${{ secrets.PERFSEE_TOKEN }}
      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist
          if-no-files-found: error

  build-server-native:
    name: Build Server native - ${{ matrix.targets.name }}
    runs-on: ubuntu-22.04
    environment: ${{ inputs.build-type }}
    strategy:
      fail-fast: false
      matrix:
        # All three arches are required: the napi loader in
        # packages/backend/native/index.js references each one from a `catch`
        # block, so the server bundle fails to resolve any missing .node file.
        targets:
          - name: x86_64-unknown-linux-gnu
            file: server-native.x64.node
          - name: aarch64-unknown-linux-gnu
            file: server-native.arm64.node
          - name: armv7-unknown-linux-gnueabihf
            file: server-native.armv7.node
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server-native
      - name: Build Rust
        uses: ./.github/actions/build-rust
        env:
          AFFINE_PRO_PUBLIC_KEY: ${{ secrets.AFFINE_PRO_PUBLIC_KEY }}
          AFFINE_PRO_LICENSE_AES_KEY: ${{ secrets.AFFINE_PRO_LICENSE_AES_KEY }}
        with:
          target: ${{ matrix.targets.name }}
          package: '@affine/server-native'
      - name: Rename ${{ matrix.targets.file }}
        run: |
          mv ./packages/backend/native/server-native.node ./packages/backend/native/${{ matrix.targets.file }}
      - name: Upload ${{ matrix.targets.file }}
        uses: actions/upload-artifact@v4
        with:
          name: server-native-${{ matrix.targets.file }}
          path: ./packages/backend/native/${{ matrix.targets.file }}
          if-no-files-found: error

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs:
      - build-server-native
    steps:
      - uses: actions/checkout@v7
      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server @types/affine__env
      - name: Download server-native
        uses: actions/download-artifact@v4
        with:
          pattern: server-native-*
          merge-multiple: true
          path: ./packages/backend/native
      - name: List server-native files
        run: ls -alh ./packages/backend/native
      - name: Build Server
        run: yarn workspace @affine/server build
      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
          if-no-files-found: error

  build-images:
    name: Build Images
    runs-on: ubuntu-latest
    # Optional bundles (admin/mobile) may be skipped; only fail the image when a
    # job that actually ran failed.
    if: ${{ !cancelled() && !failure() }}
    needs:
      - build-server
      - build-web
      - build-mobile
      - build-admin
    steps:
      - uses: actions/checkout@v7
      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: ./packages/backend/server/dist
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          logout: false
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # setup node without cache configuration
      # Prisma cache is not compatible with docker build cache
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: https://npm.pkg.github.com
          scope: '@toeverything'

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: ./packages/frontend/apps/web/dist

      - name: Download mobile artifact
        if: ${{ inputs.build-mobile }}
        uses: actions/download-artifact@v4
        with:
          name: mobile
          path: ./packages/frontend/apps/mobile/dist

      - name: Provide empty mobile artifact
        if: ${{ !inputs.build-mobile }}
        run: mkdir -p ./packages/frontend/apps/mobile/dist

      - name: Download admin artifact
        if: ${{ inputs.build-admin }}
        uses: actions/download-artifact@v4
        with:
          name: admin
          path: ./packages/frontend/admin/dist

      - name: Provide empty admin artifact
        if: ${{ !inputs.build-admin }}
        run: mkdir -p ./packages/frontend/admin/dist

      - name: Install Node.js dependencies
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64", "arm64", "arm"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production

      - name: Generate Prisma client
        run: yarn workspace @affine/server prisma generate

      - name: Mv node_modules
        run: mv ./node_modules ./packages/backend/server

      - name: Setup Version
        uses: ./.github/actions/setup-version
        with:
          app-version: ${{ inputs.app-version }}

      - name: Compose image tags
        id: tags
        env:
          IMAGE_NAMESPACE: ${{ inputs.image-namespace || github.repository_owner }}
          TAG_SUFFIX: ${{ inputs.build-type }}-${{ inputs.git-short-hash }}
          APP_VERSION: ${{ inputs.app-version }}
          BUILD_TYPE: ${{ inputs.build-type }}
        run: |
          set -euo pipefail
          tags="ghcr.io/${IMAGE_NAMESPACE}/affine:${TAG_SUFFIX}"
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          mkdir -p ./image-meta
          node -e '
            const fs = require("node:fs");
            fs.writeFileSync(
              "./image-meta/image-meta.json",
              JSON.stringify(
                {
                  tag: process.env.TAG_SUFFIX,
                  buildType: process.env.BUILD_TYPE,
                  version: process.env.APP_VERSION,
                  image: `ghcr.io/${process.env.IMAGE_NAMESPACE}/affine`,
                },
                null,
                2
              ) + "\n"
            );
          '
          {
            echo ""
            echo "### Built image"
            echo ""
            echo '```'
            echo "${tags}"
            echo '```'
            echo ""
            echo "Next: run the **Publish Docker Image** workflow to copy it to Docker Hub and move the release tags."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build backend Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: ${{ inputs.platforms }}
          provenance: true
          file: .github/deployment/node/Dockerfile
          tags: ${{ steps.tags.outputs.tags }}

      - name: Make the GHCR package public
        # GHCR packages start out private, so anonymous pulls would 401 even
        # though the repository is public. Best effort: the image is already
        # pushed at this point.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          IMAGE_NAMESPACE: ${{ inputs.image-namespace || github.repository_owner }}
        run: |
          set -uo pipefail
          for endpoint in \
            "/user/packages/container/affine" \
            "/orgs/${IMAGE_NAMESPACE}/packages/container/affine"; do
            if gh api --method PATCH "${endpoint}" -f visibility=public >/dev/null 2>&1; then
              echo "GHCR package 'affine' is public (via ${endpoint})."
              exit 0
            fi
          done
          echo "::warning::Could not change the GHCR package visibility automatically (the token needs the packages write scope). Set it by hand: https://github.com/users/${IMAGE_NAMESPACE}/packages/container/affine/settings → Change visibility → Public."

      - name: Upload image metadata
        # Small hand-off file: the publish workflow reads it to learn which tag
        # the most recent build produced.
        uses: actions/upload-artifact@v4
        with:
          name: image-meta
          path: ./image-meta
          if-no-files-found: error
          retention-days: 30
